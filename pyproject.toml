[project]
name = "glimpse"
version = "0.1.0"
description = "Local-first Linux facial-authentication framework for Kubuntu/KDE Plasma 6 Wayland"
authors = [{ name = "stealthtensor" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "onnxruntime>=1.17.0",
    "cryptography>=42.0.0",
]

[project.scripts]
glimpse = "glimpse.cli.main:main"
glimpsed = "glimpse.daemon.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glimpse"]
